# SPDX-License-Identifier: LGPL-2.1-or-later

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public LGPL boundary, Android and desktop APIs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out public bridge runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject private runner configuration
        run: |
          if grep -R -nE '^[[:space:]]*(runs-on:.*self-hosted|group:.*suvio-)' .github/workflows; then
            echo 'Public LGPL builds must use GitHub-hosted runners.' >&2
            exit 1
          fi

      - name: Check out immutable public FFmpeg runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SuvioMedia/KMediaFfmpegRuntime
          ref: 641d62b0700426949c27e1f707a281e0aaefe0b2
          path: .ffmpeg-runtime
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@97412ecb7d592380790396ad7c82bf8e1ba8a937 # v6.1.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@97412ecb7d592380790396ad7c82bf8e1ba8a937 # v6.1.1

      - name: Install Android SDK 37
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify the public runtime
        run: >-
          ./gradlew verifyAll
          -PkmediaFfmpegRuntimeProjectDir="$GITHUB_WORKSPACE/.ffmpeg-runtime"
          --no-configuration-cache
          --no-daemon
